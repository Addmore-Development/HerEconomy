
<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Her Economy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <main id="main">
        <div class="gallery-filter">
            <button class="active" data-filter="all">All</button>
            <button data-filter="event">Event</button>
            <button data-filter="networking">Networking &amp; Community</button>
        </div>

        <div class="gallery-container" id="galleryGrid">
            <div class="gallery-item" data-category="event"><img src="../images/2026/03/her_economy_new_1.jpg" alt="Her Economy Event" loading="lazy" /></div>
            <div class="gallery-item" data-category="event"><img src="../images/2026/03/her_economy_new_2.jpg" alt="Her Economy Event" loading="lazy" /></div>
            <div class="gallery-item" data-category="event"><img src="../images/2026/03/her_economy_new_3.jpg" alt="Her Economy Event" loading="lazy" /></div>
            <div class="gallery-item" data-category="event"><img src="../images/2026/03/her_economy_new_4.jpg" alt="Her Economy Event" loading="lazy" /></div>
            <div class="gallery-item" data-category="event"><img src="../images/2026/03/her_economy_new_5.jpg" alt="Her Economy Event" loading="lazy" /></div>
            <div class="gallery-item" data-category="event"><img src="../images/2026/03/her_economy_new_6.jpg" alt="Her Economy Event" loading="lazy" /></div>
            <div class="gallery-item" data-category="event"><img src="../images/2026/03/her_economy_new_7.jpg" alt="Her Economy Event" loading="lazy" /></div>
            <div class="gallery-item" data-category="event"><img src="../images/2026/03/her_economy_new_8.jpg" alt="Her Economy Event" loading="lazy" /></div>
            <div class="gallery-item" data-category="event"><img src="../images/2026/03/her_economy_new_9.jpg" alt="Her Economy Event" loading="lazy" /></div>
            <div class="gallery-item" data-category="event"><img src="../images/2026/03/her_economy_new_10.jpg" alt="Her Economy Event" loading="lazy" /></div>
            <div class="gallery-item" data-category="event"><img src="../images/2026/03/her_economy_new_11.jpg" alt="Her Economy Event" loading="lazy" /></div>
            <div class="gallery-item" data-category="event"><img src="../images/2026/03/her_economy_new_12.jpg" alt="Her Economy Event" loading="lazy" /></div>
            <div class="gallery-item" data-category="event"><img src="../images/2026/03/her_economy_new_13.jpg" alt="Her Economy Event" loading="lazy" /></div>
            <div class="gallery-item" data-category="event"><img src="../images/2026/03/her_economy_new_14.jpg" alt="Her Economy Event" loading="lazy" /></div>
            <div class="gallery-item" data-category="networking"><img src="../images/2026/03/her_economy_1.jpg" alt="Her Economy Networking" loading="lazy" /></div>
            <div class="gallery-item" data-category="networking"><img src="../images/2026/03/her_economy_2.jpg" alt="Her Economy Networking" loading="lazy" /></div>
            <div class="gallery-item" data-category="networking"><img src="../images/2026/03/her_economy_3.jpg" alt="Her Economy Networking" loading="lazy" /></div>
            <div class="gallery-item" data-category="networking"><img src="../images/2024/12/her-economy-slide2.jpg" alt="Her Economy" loading="lazy" /></div>
            <div class="gallery-item" data-category="networking"><img src="../images/2024/12/resize_w-17.jpg" alt="Her Economy" loading="lazy" /></div>
            <div class="gallery-item" data-category="networking"><img src="../images/2024/12/resize_w-18.jpg" alt="Her Economy" loading="lazy" /></div>
            <div class="gallery-item" data-category="networking"><img src="../images/2024/12/resize_w-19.jpg" alt="Her Economy" loading="lazy" /></div>
            <div class="gallery-item" data-category="networking"><img src="../images/2024/12/resize_WO-2.jpg" alt="Her Economy" loading="lazy" /></div>
            <div class="gallery-item" data-category="networking"><img src="../images/2024/12/resize_WO-3.jpg" alt="Her Economy" loading="lazy" /></div>
            <div class="gallery-item" data-category="networking"><img src="../images/2024/12/resize_WO-17-2.jpg" alt="Her Economy" loading="lazy" /></div>
            <div class="gallery-item" data-category="networking"><img src="../images/2024/12/resize_WO-17-3.jpg" alt="Her Economy" loading="lazy" /></div>
        </div>
    </main>

    <div class="lightbox-overlay" id="lightbox">
        <span class="lightbox-close" id="lightboxClose">&times;</span>
        <span class="lightbox-prev" id="lightboxPrev">&#8249;</span>
        <img src="" alt="Gallery image" id="lightboxImg" />
        <span class="lightbox-next" id="lightboxNext">&#8250;</span>
    </div>

    <div id="footer-placeholder"></div>

    <script src="../js/script.js"></script>
    <script>
        fetch('../components/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                setActiveNavLink('gallery.html');
                initMobileToggle();
            })
            .catch(error => console.error('Error loading header:', error));
        
        fetch('../components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Error loading footer:', error));

        // Gallery filter and lightbox functionality
        const filterBtns = document.querySelectorAll('.gallery-filter button');
        const galleryItems = document.querySelectorAll('.gallery-item');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxClose = document.getElementById('lightboxClose');
        const lightboxPrev = document.getElementById('lightboxPrev');
        const lightboxNext = document.getElementById('lightboxNext');

        let visibleItems = [];
        let currentIndex = 0;

        function buildVisible() {
            visibleItems = Array.from(document.querySelectorAll('.gallery-item:not(.hide)'));
        }

        function openLightbox(index) {
            currentIndex = index;
            const img = visibleItems[currentIndex].querySelector('img');
            lightboxImg.src = img.src;
            lightboxImg.alt = img.alt;
            lightbox.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('open');
            document.body.style.overflow = '';
        }

        function showPrev() {
            currentIndex = (currentIndex - 1 + visibleItems.length) % visibleItems.length;
            lightboxImg.src = visibleItems[currentIndex].querySelector('img').src;
        }

        function showNext() {
            currentIndex = (currentIndex + 1) % visibleItems.length;
            lightboxImg.src = visibleItems[currentIndex].querySelector('img').src;
        }

        if (filterBtns.length) {
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const filter = btn.getAttribute('data-filter');
                    galleryItems.forEach(item => {
                        const cat = item.getAttribute('data-category');
                        if (filter === 'all' || cat === filter) {
                            item.classList.remove('hide');
                        } else {
                            item.classList.add('hide');
                        }
                    });
                    buildVisible();
                });
            });
        }

        if (galleryItems.length) {
            galleryItems.forEach((item) => {
                item.addEventListener('click', () => {
                    buildVisible();
                    const visIdx = visibleItems.indexOf(item);
                    if (visIdx >= 0) openLightbox(visIdx);
                });
            });
        }

        if (lightboxClose) lightboxClose.addEventListener('click', closeLightbox);
        if (lightboxPrev) lightboxPrev.addEventListener('click', (e) => { e.stopPropagation(); showPrev(); });
        if (lightboxNext) lightboxNext.addEventListener('click', (e) => { e.stopPropagation(); showNext(); });
        if (lightbox) lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
        document.addEventListener('keydown', (e) => {
            if (!lightbox?.classList.contains('open')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') showPrev();
            if (e.key === 'ArrowRight') showNext();
        });

        buildVisible();
    </script>
</body>
</html>
